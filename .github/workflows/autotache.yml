name: AutoTache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  run-autotache:
    name: Run AutoTache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout persistent state
        uses: actions/checkout@v4
        with:
          ref: autotache-state
          path: _state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: Create runtime folders
        run: |
          mkdir -p data
          mkdir -p exports/offres
          mkdir -p exports/candidatures
          mkdir -p exports/debug
          mkdir -p profile
          mkdir -p logs

      - name: Create temporary .env
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          values = {
              "FRANCE_TRAVAIL_CLIENT_ID": os.environ["FRANCE_TRAVAIL_CLIENT_ID"],
              "FRANCE_TRAVAIL_CLIENT_SECRET": os.environ["FRANCE_TRAVAIL_CLIENT_SECRET"],
              "ADZUNA_APP_ID": os.environ["ADZUNA_APP_ID"],
              "ADZUNA_APP_KEY": os.environ["ADZUNA_APP_KEY"],
              "JOOBLE_API_KEY": os.environ["JOOBLE_API_KEY"],
              "JSEARCH_API_KEY": os.environ["JSEARCH_API_KEY"],
              "DISCORD_WEBHOOK_URL": os.environ["DISCORD_WEBHOOK_URL"],
              "SUPABASE_URL": os.environ["SUPABASE_URL"],
              "SUPABASE_SECRET_KEY": os.environ["SUPABASE_SECRET_KEY"],
              "SUPABASE_OWNER_ID": os.environ["SUPABASE_OWNER_ID"],
              "GITHUB_RUN_ID": os.environ["GITHUB_RUN_ID"],
              "GITHUB_EVENT_NAME": os.environ["GITHUB_EVENT_NAME"],
              "FRANCE_TRAVAIL_SCOPE": "api_offresdemploiv2 o2dsoffre",
              "FRANCE_TRAVAIL_TOKEN_URL": "https://entreprise.francetravail.fr/connexion/oauth2/access_token?realm=/partenaire",
              "FRANCE_TRAVAIL_API_BASE_URL": "https://api.francetravail.io/partenaire/offresdemploi/v2",
          }

          content = "\n".join(f"{key}={value}" for key, value in values.items())
          Path(".env").write_text(content + "\n", encoding="utf-8")
          PY

      - name: Create temporary CV profile
        env:
          CV_PROFILE_YAML_B64: ${{ secrets.CV_PROFILE_YAML_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded_profile = os.environ.get("CV_PROFILE_YAML_B64", "").strip()
          if not encoded_profile:
              raise SystemExit("Secret CV_PROFILE_YAML_B64 manquant: generation CV automatique activee.")

          try:
              profile_content = base64.b64decode(encoded_profile, validate=True)
          except Exception as exc:
              raise SystemExit("Secret CV_PROFILE_YAML_B64 invalide: impossible de reconstruire le profil CV.") from exc

          profile_path = Path("profile/profil_maitre.yaml")
          profile_path.parent.mkdir(parents=True, exist_ok=True)
          profile_path.write_bytes(profile_content)
          profile_path.chmod(0o600)
          PY

      - name: Create temporary cloud config
        run: |
          cat > config.yaml <<'YAML'
          keywords:
            - wordpress
            - developpeur wordpress
            - integrateur wordpress
            - integrateur web
            - integrateur front-end
            - developpeur front-end
            - frontend developer
            - front-end developer
            - webdesigner
            - designer web
            - ui designer
            - ux designer
            - ui/ux designer
            - graphiste web
            - graphiste
            - figma
            - elementor
            - woocommerce
            - html
            - css
            - javascript
            - react
            - vue.js
            - tailwind
            - bootstrap

          communes:
            - "21231"
            - "21200"

          distance_km: 30
          contract_types:
            - CDI
            - CDD
          days_back: 30
          allow_internship: false
          allow_apprenticeship: false

          api:
            request_delay_seconds: 0.8
            max_retries: 3

          sources:
            france_travail:
              enabled: true
            adzuna:
              enabled: true
              country: fr
              max_pages: 1
              results_per_page: 20
              keywords:
                - informatique
              location: Dijon
            jooble:
              enabled: true
              base_url: "https://fr.jooble.org/api"
              max_pages: 1
              keywords:
                - informatique
                - web
                - developpeur
              location: Dijon
            jsearch:
              enabled: true
              base_url: "https://jsearch.p.rapidapi.com/search-v2"
              host: "jsearch.p.rapidapi.com"
              max_pages: 3
              queries:
                - "informatique Bourgogne Franche-Comté France"
              country: fr
              language: fr
              location: ""
              radius:
              date_posted: month
              employment_types:
                - FULLTIME
            arbeitnow:
              enabled: false
              max_pages: 1
              keywords: []
              allowed_locations: []
            remotive:
              enabled: false
              keywords: []

          notifications:
            discord_enabled: true
            notify_when_no_results: true

          cv_generation:
            enabled: true
            profile_path: profile/profil_maitre.yaml
            output_dir: exports/candidatures
            mode: recruiter

          supabase:
            enabled: true
            bucket_name: candidate-documents
            fail_run_on_error: false

          filters:
            exclude_terms:
              - data scientist
              - data engineer
              - data analyst
              - calcul scientifique
              - ingenieur mecanique
              - ingenieur btp
              - ingenieur qualite
              - ingenieur methodes
              - ingenieur maintenance
              - commercial
            include_terms:
              - front-end
              - frontend
              - wordpress
              - integrateur
              - ui
              - ux
              - webdesigner
              - graphiste web
          YAML

      - name: Restore persistent state
        run: |
          mkdir -p data
          mkdir -p exports/offres
          if [ -f _state/cloud_state/offres_suivi.xlsx ]; then
            cp _state/cloud_state/offres_suivi.xlsx exports/offres/offres_suivi.xlsx
          fi
          if [ -f _state/cloud_state/seen_offer_ids.json ]; then
            cp _state/cloud_state/seen_offer_ids.json data/seen_offer_ids.json
          fi

      - name: Run AutoTache
        run: python -m autotache_jobs --debug

      - name: Save persistent state
        if: success()
        run: |
          mkdir -p _state/cloud_state
          if [ -f exports/offres/offres_suivi.xlsx ]; then
            cp exports/offres/offres_suivi.xlsx _state/cloud_state/offres_suivi.xlsx
          fi
          if [ -f data/seen_offer_ids.json ]; then
            cp data/seen_offer_ids.json _state/cloud_state/seen_offer_ids.json
          fi
          cd _state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_state/offres_suivi.xlsx cloud_state/seen_offer_ids.json
          if git diff --cached --quiet; then
            echo "No persistent state changes to commit."
          else
            git commit -m "Update AutoTache persistent state"
            git push origin HEAD:autotache-state
          fi

      - name: Install rclone
        if: success()
        run: |
          echo "Installing rclone"
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        if: success()
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Upload exports to OneDrive
        if: success()
        run: |
          if [ -d exports ]; then
            echo "Uploading exports to OneDrive"
            rclone copy exports onedrive_autotache:Documents/autotache --create-empty-src-dirs
          else
            echo "No exports directory found; skipping OneDrive upload."
          fi

      - name: Upload exports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotache-exports
          path: |
            exports/
            !exports/candidatures/**
          if-no-files-found: warn

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotache-logs
          path: logs/
          if-no-files-found: ignore
